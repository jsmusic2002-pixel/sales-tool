<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>매출 입력 변환</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#16181d;--mut:#6b7280;--line:#e5e7eb;--pri:#4f46e5;--pri2:#eef0ff;--err:#dc2626;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#eceef2;--mut:#9aa1ad;--line:#2a2f38;--pri:#818cf8;--pri2:#23264a;--err:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.55 -apple-system,"Pretendard","Malgun Gothic",system-ui,sans-serif}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:15px;margin:0 8px 14px}aside .grp{margin:14px 8px 4px;font-size:12px;color:var(--mut)}
aside a{display:block;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none}aside a:hover{background:var(--bg)}aside a.on{background:var(--pri2);color:var(--pri);font-weight:600}
details summary{padding:7px 10px;cursor:pointer;border-radius:8px;list-style:none;font-weight:500}details summary:hover{background:var(--bg)}details summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}details a{padding-left:26px}
.plist{max-height:min(26rem,55vh);overflow-y:auto;margin-top:6px;border-radius:8px}.plist:not(:empty){border:1px solid var(--line)}
button.sm,.btn.sm{padding:5px 11px;font-size:13px}.btn.ghost{background:none;color:var(--pri);border:1px solid var(--pri)}
.pick{font-size:14.5px;color:var(--tx);padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}.pick:hover{background:var(--pri2)}
aside .me{position:absolute;bottom:14px;left:12px;right:12px;font-size:12px;color:var(--mut)}
main{padding:26px;max-width:1000px;width:100%}h2{margin:0 0 16px;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}input:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
button,.btn{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}
button.sub{background:none;color:var(--mut);border:1px solid var(--line);padding:4px 10px}button.del{background:none;color:var(--err);border:1px solid var(--line);padding:3px 9px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{font-size:12.5px;color:var(--mut);display:block}label>*{display:block;margin-top:4px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12.5px}td{white-space:pre-line}
.mut{color:var(--mut)}.err{color:var(--err)}.ok{color:var(--ok)}.wrap{overflow-x:auto}.toast{background:var(--pri2);color:var(--pri);border-radius:8px;padding:9px 12px;margin-bottom:14px}.toast.bad{background:#fee2e2;color:#b91c1c}
.login{max-width:340px;margin:12vh auto}.login input{width:100%;margin-bottom:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}aside .me{position:static;margin-top:10px}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>window.PLUGINS = [];</script>
<!-- ▼ 새 프로그램을 추가할 때는 plugins/ 폴더에 파일을 만들고 아래에 한 줄만 추가하세요 -->
<script src="plugins/emp-ecount.js"></script>
<script src="plugins/coupang-ecount.js"></script>
<!-- ▲ -->
<script src="dashboard.js"></script>
<script src="app.js"></script>
</body></html>
